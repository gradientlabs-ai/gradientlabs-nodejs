name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Named by major so required status checks survive version bumps.
    name: build (${{ matrix.major }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exact releases with the eMudhra CA fix: setup-node's manifest lags
        # them, so "22" and "24" still resolve to unpatched builds.
        include:
          - major: 22
            node-version: 22.23.4
          - major: 24
            node-version: 24.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
